<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Fight</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="loader"><div class="spin">Loading Robot Fight<div class="barline"><i id="loadbar"></i></div></div></div>
  <div id="hud">
    <div id="top">
      <div class="fighter-hud">
        <div class="name" id="n1">Blue — Player</div>
        <div class="bar blue"><i id="hp1"></i></div>
        <div class="parts" id="parts1">
          <i data-part="head" title="Head"></i>
          <i data-part="torso" title="Torso"></i>
          <i data-part="armL" title="Left arm"></i>
          <i data-part="armR" title="Right arm"></i>
          <i data-part="legL" title="Left leg"></i>
          <i data-part="legR" title="Right leg"></i>
        </div>
      </div>
      <div class="title">Window Workshop Games<strong>Robot Fight</strong></div>
      <div class="fighter-hud right">
        <div class="name" id="n2">Red — CPU</div>
        <div class="bar red"><i id="hp2"></i></div>
        <div class="parts" id="parts2">
          <i data-part="head" title="Head"></i>
          <i data-part="torso" title="Torso"></i>
          <i data-part="armL" title="Left arm"></i>
          <i data-part="armR" title="Right arm"></i>
          <i data-part="legL" title="Left leg"></i>
          <i data-part="legR" title="Right leg"></i>
        </div>
      </div>
    </div>
    <div id="bottom">
      <div>
        <kbd>A</kbd>/<kbd>D</kbd> sidestep
        · <kbd>W</kbd>/<kbd>S</kbd> in/out
        · <kbd>J</kbd> punch
        · <kbd>K</kbd> kick
        · <kbd>L</kbd> block
        · gamepad OK
      </div>
      <div id="gfx-wrap">
        <label for="gfx">Graphics</label>
        <select id="gfx">
          <option value="high">High</option>
          <option value="low">Low</option>
        </select>
      </div>
    </div>
  </div>
  <div id="banner"><span>FIGHT!</span></div>
  <div id="overlay" class="hidden">
    <div class="card">
      <h2 id="ko-title">Down</h2>
      <p id="ko-sub">The match is over.</p>
      <button type="button" id="again">Fight again</button>
    </div>
  </div>
  <script type="module" src="./js/game.js"></script>
</body>
</html>
